[project]
name = "push-to-clip"
version = "0.2.0"
description = "Copy text, files, or piped input to your system clipboard — cross-platform, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Moritz Voigt" }]
keywords = ["clipboard", "cli", "copy", "cross-platform", "ai-agent", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MoritzV42/push-to-clip"
Portfolio = "https://moritzvoigt.infinityspace42.de"

[project.scripts]
push-to-clip = "push_to_clip.cli:main"
ptc = "push_to_clip.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["push_to_clip"]

[tool.setuptools.package-data]
push_to_clip = ["toast.ps1"]
